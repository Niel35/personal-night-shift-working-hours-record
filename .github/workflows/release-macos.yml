name: Build and release macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - macos-kit-1.1.7.zip
      - .github/workflows/release-macos.yml

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract macOS source kit
        run: |
          mkdir build
          unzip -q macos-kit-1.1.7.zip -d build

      - name: Verify embedded update service
        working-directory: build/macos-kit-1.1.7
        run: |
          python3 - <<'PY'
          from app.app_info import APP_VERSION, UPDATE_MANIFEST_URL

          assert APP_VERSION == "1.1.7"
          assert UPDATE_MANIFEST_URL == "https://github.com/Niel35/personal-night-shift-working-hours-record/releases/latest/download/update.json"
          print(APP_VERSION, UPDATE_MANIFEST_URL)
          PY

      - name: Build and test native Apple Silicon application
        working-directory: build/macos-kit-1.1.7
        run: |
          chmod +x build_macos_user.sh
          ./build_macos_user.sh

      - name: Prepare release files
        run: |
          mkdir release-assets
          cp "build/macos-kit-1.1.7/release_packages/macos_user_install/v1.1.7/PersonalNightShiftWorkingHoursRecord-macOS-1.1.7.zip" release-assets/
          cp "build/macos-kit-1.1.7/release_packages/macos_user_install/v1.1.7/PersonalNightShiftWorkingHoursRecord-macOS-1.1.7.dmg" release-assets/
          cp "build/macos-kit-1.1.7/release_packages/macos_user_install/v1.1.7/PersonalNightShiftWorkingHoursRecord-macOS-Installer-1.1.7.pkg" release-assets/
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          asset = Path("release-assets/PersonalNightShiftWorkingHoursRecord-macOS-1.1.7.zip")
          sha256 = hashlib.sha256(asset.read_bytes()).hexdigest()
          base = "https://github.com/Niel35/personal-night-shift-working-hours-record/releases/download/v1.1.7"
          manifest = {
              "latest_version": "1.1.7",
              "download_url": f"{base}/{asset.name}",
              "downloads": {
                  "macos": {
                      "download_url": f"{base}/{asset.name}",
                      "sha256": sha256,
                  }
              },
              "release_notes": "Fixes compressed and clipped table text on compact MacBook screens with readable column widths, smooth horizontal scrolling, and synchronized headers.",
          }
          Path("release-assets/update.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.7 \
            release-assets/PersonalNightShiftWorkingHoursRecord-macOS-Installer-1.1.7.pkg \
            release-assets/PersonalNightShiftWorkingHoursRecord-macOS-1.1.7.zip \
            release-assets/PersonalNightShiftWorkingHoursRecord-macOS-1.1.7.dmg \
            release-assets/update.json \
            --title "Personal Night-Shift Working Hours Record v1.1.7" \
            --notes "Fixes the compressed table on 13-inch and 14-inch MacBook displays. Columns now retain readable minimum widths, full weekday and action-button labels remain visible, horizontal trackpad scrolling is smooth, and the custom blue header stays aligned with the data while scrolling. Includes 38 passing tests."
