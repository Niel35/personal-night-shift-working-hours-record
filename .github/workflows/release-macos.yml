name: Build and release Windows and macOS v1.1.14

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - macos-kit-v1.1.14.zip
      - .github/workflows/release-macos.yml

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract verified source kit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build | Out-Null
          Expand-Archive macos-kit-v1.1.14.zip -DestinationPath build
      - name: Test and build Windows app
        working-directory: build/macos-kit-v1.1.14
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m compileall app calculations database exports backup tests sample_data
          $env:QT_QPA_PLATFORM = "offscreen"
          python -m pytest
          python -m PyInstaller night_shift_salary_recorder.spec --clean --noconfirm
          Compress-Archive -Path dist/PersonalNightShiftWorkingHoursRecord `
            -DestinationPath PersonalNightShiftWorkingHoursRecord-Windows-1.1.14.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-v1.1.14
          path: build/macos-kit-v1.1.14/PersonalNightShiftWorkingHoursRecord-Windows-1.1.14.zip
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract verified source kit
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import shutil
          import zipfile

          archive = Path("macos-kit-v1.1.14.zip")
          output = Path("build").resolve()
          output.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive) as source:
              for member in source.infolist():
                  normalized = member.filename.replace("\\", "/")
                  relative = PurePosixPath(normalized)
                  if relative.is_absolute() or ".." in relative.parts:
                      raise RuntimeError(f"Unsafe archive member: {member.filename}")
                  target = output.joinpath(*relative.parts)
                  if member.is_dir() or normalized.endswith("/"):
                      target.mkdir(parents=True, exist_ok=True)
                      continue
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with source.open(member) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)

          build_script = output / "macos-kit-v1.1.14" / "build_macos_user.sh"
          if not build_script.is_file():
              raise RuntimeError(f"Build script was not extracted: {build_script}")
          PY
      - name: Test and build native Apple Silicon app
        working-directory: build/macos-kit-v1.1.14
        run: |
          chmod +x build_macos_user.sh
          ./build_macos_user.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-v1.1.14
          path: |
            build/macos-kit-v1.1.14/release_packages/macos_user_install/v1.1.14/PersonalNightShiftWorkingHoursRecord-macOS-Installer-1.1.14.pkg
            build/macos-kit-v1.1.14/release_packages/macos_user_install/v1.1.14/PersonalNightShiftWorkingHoursRecord-macOS-1.1.14.zip
            build/macos-kit-v1.1.14/release_packages/macos_user_install/v1.1.14/PersonalNightShiftWorkingHoursRecord-macOS-1.1.14.dmg
          if-no-files-found: error

  publish:
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release-v1.1.14"
          path: release-assets
          merge-multiple: true
      - name: Create secure platform update manifest
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import date
          from pathlib import Path

          root = Path("release-assets")
          windows = root / "PersonalNightShiftWorkingHoursRecord-Windows-1.1.14.zip"
          macos = root / "PersonalNightShiftWorkingHoursRecord-macOS-1.1.14.zip"
          base = "https://github.com/Niel35/personal-night-shift-working-hours-record/releases/download/v1.1.14"

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as file:
                  for chunk in iter(lambda: file.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          manifest = {
              "latest_version": "1.1.14",
              "download_url": f"{base}/{windows.name}",
              "sha256": sha256(windows),
              "published_at": date.today().isoformat(),
              "mandatory": False,
              "downloads": {
                  "windows": {
                      "download_url": f"{base}/{windows.name}",
                      "sha256": sha256(windows),
                      "filename": windows.name,
                  },
                  "macos": {
                      "download_url": f"{base}/{macos.name}",
                      "sha256": sha256(macos),
                      "filename": macos.name,
                  },
              },
              "release_notes": (
                  "Corrects overtime calculations on Windows and macOS so hours "
                  "already paid as daily overtime do not trigger weekly overtime "
                  "again, including weeks that cross between two months."
              ),
          }
          (root / "update.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Publish GitHub release v1.1.14
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.14 --repo Niel35/personal-night-shift-working-hours-record \
            release-assets/PersonalNightShiftWorkingHoursRecord-Windows-1.1.14.zip \
            release-assets/PersonalNightShiftWorkingHoursRecord-macOS-Installer-1.1.14.pkg \
            release-assets/PersonalNightShiftWorkingHoursRecord-macOS-1.1.14.zip \
            release-assets/PersonalNightShiftWorkingHoursRecord-macOS-1.1.14.dmg \
            release-assets/update.json \
            --title "Personal Night-Shift Working Hours Record v1.1.14" \
            --notes "Corrects overtime calculations on Windows and macOS so hours already paid as daily overtime do not trigger weekly overtime again, including weeks that cross between two months. The stable update.json endpoint and schema are unchanged, and platform downloads remain checksum-verified."
