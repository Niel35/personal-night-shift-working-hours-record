name: Build latest macOS package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - macos-kit-latest-20260805.zip
      - .github/workflows/release-macos.yml

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract frozen source kit
        run: |
          mkdir build
          unzip -q macos-kit-latest-20260805.zip -d build
      - name: Test and build native Apple Silicon app
        working-directory: build/macos-kit-latest-20260805
        run: |
          chmod +x build_macos_user.sh
          ./build_macos_user.sh
      - name: Upload macOS installer packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-latest-v1.1.11
          path: |
            build/macos-kit-latest-20260805/release_packages/macos_user_install/v1.1.11/PersonalNightShiftWorkingHoursRecord-macOS-Installer-1.1.11.pkg
            build/macos-kit-latest-20260805/release_packages/macos_user_install/v1.1.11/PersonalNightShiftWorkingHoursRecord-macOS-1.1.11.zip
            build/macos-kit-latest-20260805/release_packages/macos_user_install/v1.1.11/PersonalNightShiftWorkingHoursRecord-macOS-1.1.11.dmg
          if-no-files-found: error
