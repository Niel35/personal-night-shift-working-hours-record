name: Build and release macOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - macos-kit-1.1.4.zip
      - .github/workflows/release-macos.yml

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract macOS source kit
        run: |
          mkdir build
          unzip -q macos-kit-1.1.4.zip -d build

      - name: Verify embedded update service
        working-directory: build/macos-kit-1.1.4
        run: |
          python3 - <<'PY'
          from app.app_info import APP_VERSION, UPDATE_MANIFEST_URL

          assert APP_VERSION == "1.1.4"
          assert UPDATE_MANIFEST_URL == "https://github.com/Niel35/personal-night-shift-working-hours-record/releases/latest/download/update.json"
          print(APP_VERSION, UPDATE_MANIFEST_URL)
          PY

      - name: Build and test native Apple Silicon application
        working-directory: build/macos-kit-1.1.4
        run: |
          chmod +x build_macos_user.sh
          ./build_macos_user.sh

      - name: Prepare release files
        run: |
          mkdir release-assets
          cp "build/macos-kit-1.1.4/release_packages/macos_user_install/v1.1.4/PersonalNightShiftWorkingHoursRecord-macOS-1.1.4.zip" release-assets/
          cp "build/macos-kit-1.1.4/release_packages/macos_user_install/v1.1.4/PersonalNightShiftWorkingHoursRecord-macOS-1.1.4.dmg" release-assets/
          cp "build/macos-kit-1.1.4/release_packages/macos_user_install/v1.1.4/PersonalNightShiftWorkingHoursRecord-macOS-Installer-1.1.4.pkg" release-assets/
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          asset = Path("release-assets/PersonalNightShiftWorkingHoursRecord-macOS-1.1.4.zip")
          sha256 = hashlib.sha256(asset.read_bytes()).hexdigest()
          base = "https://github.com/Niel35/personal-night-shift-working-hours-record/releases/download/v1.1.4"
          manifest = {
              "latest_version": "1.1.4",
              "download_url": f"{base}/{asset.name}",
              "downloads": {
                  "macos": {
                      "download_url": f"{base}/{asset.name}",
                      "sha256": sha256,
                  }
              },
              "release_notes": "Optimized for the 14-inch M4 MacBook Pro, with a responsive 1512-point layout and a verified native Apple Silicon build.",
          }
          Path("release-assets/update.json").write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.1.4 \
            release-assets/PersonalNightShiftWorkingHoursRecord-macOS-Installer-1.1.4.pkg \
            release-assets/PersonalNightShiftWorkingHoursRecord-macOS-1.1.4.zip \
            release-assets/PersonalNightShiftWorkingHoursRecord-macOS-1.1.4.dmg \
            release-assets/update.json \
            --title "Personal Night-Shift Working Hours Record v1.1.4" \
            --notes "Optimized for the 14-inch M4 MacBook Pro. The interface now uses its compact responsive profile at the Mac's 1512-point Retina workspace, preserving complete labels and controls without horizontal scrolling. The build is also verified as native Apple Silicon arm64 before packaging."
